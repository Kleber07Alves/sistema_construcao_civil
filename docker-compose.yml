
services:

  # ── Banco de dados ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: construcao_civil_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: construcao_civil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d construcao_civil"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Backend FastAPI ─────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: construcao_civil_backend
    env_file: .env               # carrega JWT_SECRET, OPENAI_API_KEY, etc.
    environment:
      # Sobrescreve variáveis que precisam do hostname Docker interno
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/construcao_civil
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    # volumes:                   # ← DEV ONLY: descomente para hot-reload
    #   - ./backend:/app         #   (remove a necessidade de rebuild a cada mudança)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # curl é instalado no Dockerfile de produção
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s   # tempo para migrations + seed completarem
    restart: unless-stopped

  # ── Frontend Next.js ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
  
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: construcao_civil_frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
 
    depends_on:
      backend:
        condition: service_healthy   # aguarda o backend estar saudável
    restart: unless-stopped

volumes:
  postgres_data: